name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "4.1.2"
  CARGO_TERM_COLOR: always

jobs:
  program:
    name: program build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and Solana tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            ~/.cache/solana
            target
          key: program-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            program-${{ runner.os }}-${{ env.SOLANA_VERSION }}-

      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          rustc --version
          solana --version
          cargo-build-sbf --version

      # `anchor test` = build the program for the Solana VM, then `cargo test`.
      # CI runs the same two steps directly so it does not need the Anchor CLI.
      - name: Build program (SBF)
        run: cargo build-sbf --manifest-path programs/pmec/Cargo.toml

      - name: Test (math property tests + program tests in LiteSVM)
        run: cargo test --workspace

      # The TypeScript math is checked against these vectors; make sure they
      # are the ones the current Rust code produces.
      - name: Golden vectors are up to date
        run: cargo run -q -p pmec-math --example vectors | diff - packages/sdk/test/vectors.json

      # End to end on a real validator: the RFQ service settles a trade between
      # two wallets, and a swap with one failing leg moves nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a local validator with the program
        run: |
          ./scripts/local-validator.sh > validator.log 2>&1 &
          for i in $(seq 1 60); do solana cluster-version -u http://127.0.0.1:8899 >/dev/null 2>&1 && break; sleep 1; done
          solana cluster-version -u http://127.0.0.1:8899
      - name: Set up markets from recorded Gemini fixtures
        run: GEMINI_MOCK=1 ./scripts/local-setup.sh
      - name: RFQ end-to-end test
        run: E2E_RPC_URL=http://127.0.0.1:8899 npm test -w rfq

  node:
    name: sdk + services tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build the web app
        run: npm run build -w web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
