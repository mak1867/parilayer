# Fly.io app for the relayer. Deploy from the repo root:  flyctl deploy
# Secrets (set once, never committed):
#   flyctl secrets set ORACLE_KEYPAIR_JSON="$(cat keys/oracle.json)" ADMIN_KEYPAIR_JSON="$(cat keys/admin.json)"
app = "pmec-relayer"
primary_region = "ord"

[build]
  dockerfile = "relayer/deploy/Dockerfile"

[env]
  SOLANA_RPC_URL = "https://api.devnet.solana.com"

# The database (market names, pair records, trade history) lives here.
[[mounts]]
  source = "relayer_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # The relayer watches Gemini for settlements, so it must not sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
